[project]
name = "tutor-programacion"
version = "0.1.0"
description = "Agente tutor de fundamentos de programación con LLMs (Trabajo 02)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
tutor = "tutor.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade,
# N pep8-naming, D docstrings (Google), SIM simplify, RUF reglas de ruff
select = ["E", "W", "F", "I", "B", "UP", "N", "D", "SIM", "RUF"]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]  # los nombres de test ya documentan el comportamiento

[tool.mypy]
strict = true
files = ["src"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
