name: Publicar página (GitHub Pages)

on:
  push:
    branches: [main, develop]
    paths:
      - "entregables/pagina/**"
      - "entregables/capturas/**"
      - "entregables/capturas-v2/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Armar el sitio estático
        run: |
          mkdir -p _site
          cp entregables/pagina/index.html _site/index.html
          cp entregables/pagina/reporte.html _site/reporte.html
          cp -r entregables/capturas-v2 _site/capturas-v2
          cp -r entregables/capturas _site/capturas

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
