<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profe Bit — Tutor de programación</title>
<style>
  :root{--bg:#0f1420;--panel:#1a2130;--panel2:#222b3d;--tx:#e8ecf3;--dim:#93a0b4;
        --acc:#4ade80;--acc2:#22d3ee;--bad:#f87171;--warn:#fbbf24;
        font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--tx);min-height:100vh}
  header{padding:14px 22px;border-bottom:1px solid #2a3448;display:flex;gap:10px;align-items:center}
  header h1{font-size:18px} header .dot{color:var(--acc)}
  main{display:flex;gap:0;height:calc(100vh - 53px)}
  #sidebar{width:330px;min-width:260px;border-right:1px solid #2a3448;overflow-y:auto;padding:14px}
  #contenido{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .unidad{background:var(--panel);border:1px solid #2a3448;border-radius:10px;
          padding:10px 12px;margin-bottom:8px;cursor:pointer}
  .unidad:hover{border-color:var(--acc)}
  .unidad small{color:var(--dim)}
  .estado{float:right;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--dim)}
  .estado.vista{color:var(--warn)} .estado.evaluada{color:var(--acc)}
  .acciones{display:flex;gap:6px;margin-top:8px}
  button{background:var(--panel2);color:var(--tx);border:1px solid #34405a;border-radius:8px;
         padding:6px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--acc)} button.primario{background:#14532d;border-color:var(--acc)}
  button:disabled{opacity:.5;cursor:wait}
  #chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:78%;padding:12px 15px;border-radius:14px;line-height:1.55;white-space:pre-wrap;
       overflow-wrap:anywhere}
  .msg.tutor{background:var(--panel);border:1px solid #2a3448;align-self:flex-start}
  .msg.yo{background:#173a2a;align-self:flex-end}
  .msg.sistema{background:transparent;color:var(--dim);align-self:center;font-size:13px;text-align:center}
  .msg pre{background:#0b0f18;border:1px solid #2a3448;border-radius:8px;padding:10px;
           overflow-x:auto;margin:8px 0;font-size:13px;white-space:pre}
  .msg code{background:#0b0f18;border-radius:4px;padding:1px 5px;font-size:13px}
  #barra{padding:12px 20px;border-top:1px solid #2a3448;display:flex;gap:10px}
  #barra input{flex:1;background:var(--panel);border:1px solid #34405a;border-radius:10px;
               color:var(--tx);padding:11px 14px;font-size:14px}
  #barra input:focus{outline:none;border-color:var(--acc)}
  #avance{color:var(--dim);font-size:12px;align-self:center;white-space:nowrap}
  .tarjeta{background:var(--panel);border:1px solid #2a3448;border-radius:14px;
           padding:22px;max-width:560px;margin:40px auto;width:92%}
  .tarjeta h2{margin-bottom:14px} .campo{margin-bottom:12px}
  .campo label{display:block;color:var(--dim);font-size:13px;margin-bottom:4px}
  .campo select,.campo input{width:100%;background:var(--panel2);border:1px solid #34405a;
      border-radius:8px;color:var(--tx);padding:9px 11px;font-size:14px}
  .quiz-p{background:var(--panel);border:1px solid #2a3448;border-radius:12px;padding:14px;margin-bottom:12px}
  .quiz-p pre{background:#0b0f18;border-radius:8px;padding:10px;overflow-x:auto;margin:8px 0;font-size:13px}
  .opcion{display:block;margin:6px 0;padding:8px 10px;border:1px solid #2a3448;border-radius:8px;cursor:pointer}
  .opcion:hover{border-color:var(--acc2)}
  .opcion input{margin-right:8px}
  .ok{color:var(--acc)} .mal{color:var(--bad)} .dim{color:var(--dim)}
  #error{position:fixed;bottom:16px;right:16px;background:#7f1d1d;border-radius:10px;
         padding:12px 16px;max-width:420px;display:none}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--dim);
        border-top-color:var(--acc);border-radius:50%;animation:g .8s linear infinite;vertical-align:-2px}
  @keyframes g{to{transform:rotate(360deg)}}
  @media(max-width:760px){main{flex-direction:column}#sidebar{width:100%;max-height:38vh}}
</style>
</head>
<body>
<header><h1>Profe Bit <span class="dot">●</span></h1><span class="dim" id="subtitulo">tu tutor de programación</span></header>
<main>
  <nav id="sidebar"></nav>
  <section id="contenido"></section>
</main>
<div id="error"></div>
<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
let leccionActiva = null;

function mostrarError(texto){
  const caja = $("#error");
  caja.textContent = texto;
  caja.style.display = "block";
  setTimeout(() => caja.style.display = "none", 6000);
}

async function api(ruta, cuerpo){
  const opciones = cuerpo === undefined ? {} :
    {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(cuerpo)};
  const r = await fetch(ruta, opciones);
  if(!r.ok){
    const datos = await r.json().catch(() => ({}));
    throw new Error(datos.detail || `Error ${r.status}`);
  }
  return r.json();
}

// Render mínimo de Markdown (autocontenido, sin librerías)
function md(texto){
  const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const partes = texto.split(/```(?:\w*)\n?/);
  let html = "";
  partes.forEach((parte, i) => {
    if(i % 2 === 1){ html += `<pre>${esc(parte)}</pre>`; return; }
    let t = esc(parte);
    t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    t = t.replace(/^#{1,4} (.+)$/gm, "<b>$1</b>");
    html += t;
  });
  return html;
}

function burbuja(clase, texto, comoMd){
  const div = document.createElement("div");
  div.className = "msg " + clase;
  if(comoMd) div.innerHTML = md(texto); else div.textContent = texto;
  $("#chat").appendChild(div);
  $("#chat").scrollTop = $("#chat").scrollHeight;
  return div;
}

async function cargarEstado(inicial){
  if(inicial) $("#sidebar").innerHTML = '<p class="dim"><span class="spin"></span> Preparando tu curso…</p>';
  let estado;
  try{ estado = await api("/api/estado"); }
  catch(e){ mostrarError(e.message); $("#sidebar").innerHTML = ""; return; }
  if(!estado.perfil){ verFormPerfil(); $("#sidebar").innerHTML = ""; return; }
  $("#subtitulo").textContent = "curso de " + estado.lenguaje;
  const nav = $("#sidebar");
  nav.innerHTML = "";
  estado.unidades.forEach(u => {
    const div = document.createElement("div");
    div.className = "unidad";
    const nota = u.mejor_nota === null ? "" : ` · ${u.mejor_nota}/100`;
    div.innerHTML = `<span class="estado ${u.estado}">${u.estado}${nota}</span>
      <b>${u.indice + 1}. ${u.titulo}</b>
      <div class="acciones">
        <button class="primario" data-accion="leccion">Estudiar</button>
        <button data-accion="quiz">Evaluarme</button>
      </div>`;
    div.querySelector('[data-accion="leccion"]').onclick = () => iniciarLeccion(u.indice, u.titulo);
    div.querySelector('[data-accion="quiz"]').onclick = () => iniciarQuiz(u.indice, u.titulo);
    nav.appendChild(div);
  });
  if(inicial) verBienvenida();
}

function verBienvenida(){
  $("#contenido").innerHTML = `<div class="tarjeta">
    <h2>¡Ese es tu curso 👈!</h2>
    <p class="dim">Cada unidad se crea a tu medida cuando entras. Pulsa <b>Estudiar</b>
    para una lección conversada paso a paso con el tutor, o <b>Evaluarme</b> para el quiz.
    Tu progreso se guarda solo.</p></div>`;
}

function verFormPerfil(){
  $("#contenido").innerHTML = `<div class="tarjeta"><h2>Cuéntame de ti</h2>
    <div class="campo"><label>¿Cuál es tu experiencia?</label>
      <select id="f-nivel">
        <option value="nunca">Nunca he programado</option>
        <option value="basico">Sé algo básico (variables, condicionales)</option>
        <option value="scripts">He escrito scripts o programas pequeños</option>
      </select></div>
    <div class="campo"><label>¿Qué has hecho antes? (opcional)</label>
      <input id="f-exp" placeholder="p. ej. fórmulas y tablas dinámicas en Excel"></div>
    <div class="campo"><label>¿Qué quieres lograr?</label>
      <select id="f-objetivo">
        <option value="datos">Ciencia de datos / análisis</option>
        <option value="front">Desarrollo front-end</option>
        <option value="back">Desarrollo back-end</option>
        <option value="automatizacion">Automatizar tareas</option>
        <option value="otro">Otro…</option>
      </select></div>
    <div class="campo" id="f-detalle-campo" style="display:none"><label>Cuéntame tu objetivo</label>
      <input id="f-detalle"></div>
    <div class="campo"><label>¿Lenguaje preferido? (vacío = que el tutor decida)</label>
      <input id="f-lenguaje" placeholder="python, javascript…"></div>
    <button class="primario" id="f-enviar">Crear mi curso</button></div>`;
  $("#f-objetivo").onchange = (e) =>
    $("#f-detalle-campo").style.display = e.target.value === "otro" ? "block" : "none";
  $("#f-enviar").onclick = async () => {
    const boton = $("#f-enviar");
    boton.disabled = true; boton.innerHTML = '<span class="spin"></span> Diseñando tu curso…';
    try{
      await api("/api/perfil", {
        nivel: $("#f-nivel").value, objetivo: $("#f-objetivo").value,
        experiencia: $("#f-exp").value, objetivo_detalle: $("#f-detalle") ? $("#f-detalle").value : "",
        lenguaje: $("#f-lenguaje").value,
      });
      await cargarEstado(true);
    }catch(e){ mostrarError(e.message); boton.disabled = false; boton.textContent = "Crear mi curso"; }
  };
}

function verChat(titulo){
  $("#contenido").innerHTML = `
    <div id="chat"></div>
    <div id="barra">
      <span id="avance" class="dim"></span>
      <input id="entrada" placeholder="Responde al tutor… ('salir' para volver)" autocomplete="off">
      <button class="primario" id="enviar">Enviar</button>
    </div>`;
  burbuja("sistema", titulo);
  $("#enviar").onclick = enviarTurno;
  $("#entrada").addEventListener("keydown", (e) => { if(e.key === "Enter") enviarTurno(); });
}

async function iniciarLeccion(indice, titulo){
  leccionActiva = indice;
  verChat(`Unidad ${indice + 1}: ${titulo}`);
  const espera = burbuja("sistema", "El tutor está preparando tu lección…");
  try{
    const r = await api(`/api/leccion/${indice}/iniciar`);
    espera.remove();
    burbuja("tutor", "🎯 Al terminar sabrás:\n" + r.objetivos.map(o => "• " + o).join("\n") +
      "\n\nRuta: " + r.ruta.join(" → "), false);
    burbuja("tutor", r.texto, true);
    $("#avance").textContent = `paso ${r.paso}/${r.total}`;
    if(r.terminada) finLeccion(indice);
  }catch(e){ espera.textContent = ""; mostrarError(e.message); }
}

async function enviarTurno(){
  if(leccionActiva === null) return;
  const entrada = $("#entrada");
  const mensaje = entrada.value.trim();
  if(mensaje.toLowerCase() === "salir"){ leccionActiva = null; cargarEstado(true); return; }
  entrada.value = "";
  burbuja("yo", mensaje || "ok, sigamos");
  const espera = burbuja("sistema", "escribiendo…");
  $("#enviar").disabled = true;
  try{
    const r = await api(`/api/leccion/${leccionActiva}/turno`, {mensaje});
    espera.remove();
    burbuja("tutor", r.texto, true);
    $("#avance").textContent = `paso ${r.paso}/${r.total}`;
    if(r.terminada) finLeccion(leccionActiva);
  }catch(e){ espera.remove(); mostrarError(e.message); }
  $("#enviar").disabled = false;
  entrada.focus();
}

function finLeccion(indice){
  const div = burbuja("sistema", "");
  div.innerHTML = `¡Lección completada! 🎉 &nbsp;<button class="primario" id="ir-quiz">Presentar el quiz</button>`;
  div.querySelector("#ir-quiz").onclick = () => iniciarQuiz(indice, "");
  leccionActiva = null;
  cargarEstado(false);
}

async function iniciarQuiz(indice, titulo){
  leccionActiva = null;
  $("#contenido").innerHTML = `<div class="tarjeta"><h2>Quiz — unidad ${indice + 1}</h2>
    <p class="dim"><span class="spin"></span> El tutor está escribiendo tus preguntas…</p></div>`;
  let quiz;
  try{ quiz = await api(`/api/quiz/${indice}`); }
  catch(e){ mostrarError(e.message); verBienvenida(); return; }
  const cont = $("#contenido");
  cont.innerHTML = `<div style="overflow-y:auto;padding:20px"><h2 style="margin-bottom:14px">Quiz — unidad ${indice + 1}</h2>
    <div id="preguntas"></div><button class="primario" id="calificar">Calificar</button></div>`;
  quiz.preguntas.forEach((p, i) => {
    const div = document.createElement("div");
    div.className = "quiz-p";
    div.innerHTML = `<b>Pregunta ${i + 1}.</b><div>${md(p.enunciado)}</div>` +
      p.opciones.map((op, j) =>
        `<label class="opcion"><input type="radio" name="p${i}" value="${j}">${md(op)}</label>`).join("");
    $("#preguntas").appendChild(div);
  });
  $("#calificar").onclick = async () => {
    const respuestas = quiz.preguntas.map((_, i) => {
      const marcada = document.querySelector(`input[name="p${i}"]:checked`);
      return marcada ? Number(marcada.value) : -1;
    });
    if(respuestas.includes(-1)){ mostrarError("Responde todas las preguntas."); return; }
    try{
      const r = await api(`/api/quiz/${indice}/calificar`, {respuestas});
      verResultado(indice, quiz, r);
    }catch(e){ mostrarError(e.message); }
  };
}

function verResultado(indice, quiz, r){
  const clase = r.nota >= 70 ? "ok" : "mal";
  let html = `<div style="overflow-y:auto;padding:20px"><h2>Resultado: <span class="${clase}">${r.nota}/100</span></h2>`;
  r.detalle.forEach((d, i) => {
    html += `<div class="quiz-p">${d.acierto ? "✅" : "❌"} <b>P${i + 1}</b> — elegiste: ${md(d.elegida)}`;
    if(!d.acierto) html += `<div>Correcta: <span class="ok">${md(d.correcta)}</span></div>`;
    html += `<div class="dim" style="margin-top:6px">${md(d.explicacion)}</div></div>`;
  });
  if(r.conceptos_fallados.length)
    html += `<p class="dim">Para repasar: ${r.conceptos_fallados.join(", ")} — las próximas lecciones lo reforzarán.</p>`;
  html += `<div style="margin-top:14px"><button class="primario" id="volver">Volver al curso</button></div></div>`;
  $("#contenido").innerHTML = html;
  $("#volver").onclick = () => { cargarEstado(true); };
  cargarEstado(false);
}

cargarEstado(true);
</script>
</body>
</html>
