<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profe Bit — Tutor de programación</title>
<style>
  :root{
    --bg:#0b0e14; --bg-grad:radial-gradient(1100px 480px at 50% -10%, #131b2c 0%, #0b0e14 60%);
    --card:#12161f; --card2:#181d29; --linea:rgba(255,255,255,.07); --linea-fuerte:rgba(255,255,255,.15);
    --tx:#e8ecf3; --tx2:#98a2b3; --tx3:#667085;
    --acc:#7aa2ff; --acc-fondo:#16233f; --ok:#4ade80; --ok-fondo:#122619;
    --err:#f87171; --err-fondo:#2a1516; --warn:#fbbf24; --fuego:#fb923c;
    --sombra:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.6);
    --r:12px; --r-sm:8px; --r-pill:999px;
    --t1:160ms cubic-bezier(.2,0,0,1);
    font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  body{background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;
       color:var(--tx);height:100vh;font-size:15px;line-height:1.6;overflow:hidden;
       -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  h1,h2,h3{letter-spacing:-.015em;line-height:1.3}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
  button{background:var(--card2);color:var(--tx);border:1px solid var(--linea-fuerte);
         border-radius:var(--r-sm);padding:7px 13px;cursor:pointer;font-size:13px;
         font-weight:500;font-family:inherit;transition:all var(--t1)}
  button:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
  button.primario{background:linear-gradient(180deg,#82a8ff,#5c8aff);border-color:transparent;
      color:#0a1020;font-weight:600;box-shadow:0 2px 8px -2px rgba(92,138,255,.5)}
  button.sutil{background:transparent;border-color:transparent;color:var(--acc)}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none}

  header{padding:12px 22px;display:flex;gap:14px;align-items:center;
         border-bottom:1px solid var(--linea);background:rgba(11,14,20,.85);
         backdrop-filter:blur(8px);flex:none}
  .marca{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;cursor:pointer}
  .marca .logo{width:26px;height:26px;border-radius:8px;
      background:linear-gradient(135deg,#4ade80,#5c8aff);display:grid;place-items:center;
      color:#0a1020;font-size:13px;font-weight:800}
  #progreso-curso{flex:1;min-width:140px;max-width:300px;display:none}
  #progreso-curso .texto{font-size:11px;color:var(--tx2);margin-bottom:4px}
  .chip-stat{background:var(--card);border:1px solid var(--linea);border-radius:var(--r-pill);
             padding:4px 12px;font-weight:600;font-size:12.5px;cursor:help;display:none}
  #racha{color:var(--fuego)} #puntos{color:var(--warn)}
  .barra{height:5px;background:var(--card2);border-radius:var(--r-pill);overflow:hidden}
  .barra > div{height:100%;background:linear-gradient(90deg,#4ade80,#5c8aff);
      transition:width 400ms cubic-bezier(0,0,0,1)}

  main{flex:1;display:flex;flex-direction:column;min-height:0}
  #chat{flex:1;overflow-y:auto;padding:26px 24px;scroll-behavior:smooth}
  #chat .interior{max-width:760px;margin:0 auto}

  /* ---- menú de clases ---- */
  .menu-cabecera{margin-bottom:18px}
  .menu-cabecera h2{font-size:24px;margin-bottom:4px}
  .clase{background:var(--card);border:1px solid var(--linea);border-radius:var(--r);
      padding:16px 18px;margin-bottom:10px;box-shadow:var(--sombra);
      display:flex;gap:14px;align-items:flex-start;transition:all var(--t1)}
  .clase:hover:not(.bloq){border-color:var(--linea-fuerte)}
  .clase.siguiente{border-color:rgba(74,222,128,.4)}
  .clase.bloq{opacity:.45}
  .num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--linea-fuerte);
       display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--tx2);margin-top:2px}
  .num.hecha{background:var(--ok);border-color:var(--ok);color:#0a1020}
  .num.actual{border-color:var(--acc);color:var(--acc)}
  .clase .cuerpo{flex:1;min-width:0}
  .clase b{font-size:15px;font-weight:600;display:block;line-height:1.35}
  .clase ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px}
  .clase ul li{font-size:12px;color:var(--tx2);position:relative;padding-left:12px}
  .clase ul li::before{content:"·";position:absolute;left:2px;color:var(--tx3)}
  .clase.coronada b, .clase.coronada ul li{text-decoration:line-through;color:var(--tx3)}
  .clase .meta{font-size:11.5px;color:var(--tx3);margin-top:6px}
  .clase .cta{flex:none;display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .clase .cta button{font-size:12px;white-space:nowrap}

  /* ---- chat de clase ---- */
  .msg{max-width:88%;padding:13px 17px;border-radius:16px;margin-bottom:12px;
       animation:aparecer 240ms cubic-bezier(0,0,0,1)}
  .msg.tutor{background:var(--card);border:1px solid var(--linea);margin-right:auto;
      border-bottom-left-radius:5px;box-shadow:var(--sombra)}
  .msg.yo{background:var(--acc-fondo);border:1px solid rgba(122,162,255,.25);
      margin-left:auto;border-bottom-right-radius:5px}
  .msg.ancha{max-width:100%;width:100%}
  .msg.sistema{background:transparent;border:none;margin:2px auto 10px;max-width:100%;
      text-align:center;font-size:12px;color:var(--tx3);animation:none;padding:2px}
  .msg .quien{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      color:var(--tx3);margin-bottom:6px}
  @keyframes aparecer{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
  .escribiendo::after{content:"···";animation:puntos 1.2s infinite;letter-spacing:2px;font-weight:700}
  @keyframes puntos{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}

  .prosa{line-height:1.65}
  .prosa p{margin:0 0 10px} .prosa p:last-child{margin-bottom:0}
  .prosa ul,.prosa ol{margin:0 0 10px;padding-left:22px}
  .prosa li{margin-bottom:3px}
  .prosa h3{margin:14px 0 6px;font-size:15.5px}
  .prosa pre{background:#0a0d13;border:1px solid var(--linea);border-radius:var(--r-sm);
      padding:13px;overflow-x:auto;margin:10px 0;font-size:12.5px;line-height:1.55;white-space:pre}
  .prosa code{background:#0a0d13;border:1px solid var(--linea);border-radius:5px;
      padding:1px 6px;font-size:12.5px;font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .prosa pre code{border:none;padding:0;background:transparent}
  .code-acciones{display:flex;gap:6px;margin:-2px 0 10px}
  .code-acciones button{font-size:11px;padding:3px 9px;color:var(--tx2)}
  .runner{background:#0a0d13;border:1px solid var(--linea-fuerte);border-radius:var(--r-sm);
          padding:11px;margin:6px 0 12px}
  .runner textarea{width:100%;min-height:100px;background:transparent;border:none;color:var(--tx);
      font-family:ui-monospace,Menlo,monospace;font-size:12.5px;resize:vertical;line-height:1.55}
  .runner textarea:focus{outline:none}
  .runner .salida{border-top:1px dashed var(--linea-fuerte);margin-top:9px;padding-top:9px;
      font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;color:#7dd3fc}
  .runner .salida.err{color:var(--err)}

  #composer{flex:none;border-top:1px solid var(--linea);padding:12px 24px 16px;
      background:rgba(11,14,20,.85);backdrop-filter:blur(8px);display:none}
  #composer .interior{max-width:760px;margin:0 auto}
  #contexto{font-size:11.5px;color:var(--tx3);margin-bottom:8px;display:flex;
      gap:10px;align-items:center;flex-wrap:wrap}
  #contexto .avance{color:var(--acc)}
  #contexto a{color:var(--acc);text-decoration:none}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chips button{font-size:11.5px;padding:4px 11px;border-radius:var(--r-pill);color:var(--tx2)}
  .caja-input{display:flex;gap:8px;background:var(--card);border:1px solid var(--linea-fuerte);
      border-radius:14px;padding:6px;transition:border-color var(--t1);align-items:flex-end}
  .caja-input:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(122,162,255,.12)}
  .caja-input textarea{flex:1;background:transparent;border:none;color:var(--tx);
      font-family:inherit;font-size:14.5px;line-height:1.5;padding:8px 10px;resize:none;
      max-height:120px;min-height:38px}
  .caja-input textarea:focus{outline:none}

  .hero-chat{text-align:center;padding:48px 20px 24px}
  .hero-chat .logo-xl{width:52px;height:52px;border-radius:15px;margin:0 auto 16px;
      background:linear-gradient(135deg,#4ade80,#5c8aff);display:grid;place-items:center;
      font-size:24px;font-weight:800;color:#0a1020;box-shadow:0 8px 32px -8px rgba(92,138,255,.5)}
  .hero-chat h2{font-size:26px;margin-bottom:8px}
  .hero-chat .sub{color:var(--tx2);font-size:14px;max-width:460px;margin:0 auto}

  #modal{position:fixed;inset:0;background:rgba(5,8,14,.75);backdrop-filter:blur(4px);
      display:none;place-items:center;z-index:20;padding:24px}
  #modal .ventana{background:var(--card);border:1px solid var(--linea-fuerte);
      border-radius:16px;max-width:720px;width:100%;max-height:84vh;display:flex;
      flex-direction:column;box-shadow:var(--sombra)}
  #modal .barra-m{display:flex;justify-content:space-between;align-items:center;
      padding:14px 20px;border-bottom:1px solid var(--linea)}
  #modal .cuerpo-m{overflow-y:auto;padding:20px 24px}

  iframe.artefacto{width:100%;height:460px;border:1px solid var(--linea-fuerte);
      border-radius:var(--r);background:#0a0d13}
  .opcion{display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:10px 12px;
      border:1px solid var(--linea-fuerte);border-radius:var(--r-sm);cursor:pointer;
      transition:all var(--t1);background:var(--card2)}
  .opcion:hover{border-color:var(--acc)}
  .dim{color:var(--tx2)} .ok{color:var(--ok)} .mal{color:var(--err)}
  .celebra{animation:celebra 500ms cubic-bezier(0,0,0,1)}
  @keyframes celebra{0%{transform:scale(.95);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1)}}
  #toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);
      background:var(--card);border:1px solid var(--ok);border-radius:var(--r);
      padding:11px 18px;display:none;z-index:30;box-shadow:var(--sombra)}
  #error{position:fixed;bottom:88px;right:20px;background:var(--err-fondo);
      border:1px solid var(--err);border-radius:var(--r);padding:11px 15px;
      max-width:400px;display:none;z-index:30}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--tx3);
      border-top-color:var(--acc);border-radius:50%;animation:g .8s linear infinite;vertical-align:-2px}
  @keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <span class="marca" id="ir-menu" title="Ir al menú de clases"><span class="logo">Pb</span> Profe Bit</span>
  <div id="progreso-curso">
    <div class="texto" id="progreso-texto"></div>
    <div class="barra"><div id="progreso-barra" style="width:0%"></div></div>
  </div>
  <span class="chip-stat" id="racha" title="Días seguidos estudiando."></span>
  <span class="chip-stat" id="puntos" title="Puntos por avanzar y aprobar clases."></span>
</header>
<main>
  <div id="chat"><div class="interior" id="mensajes"></div></div>
  <div id="composer"><div class="interior">
    <div id="contexto"></div>
    <div class="chips" id="sugerencias"></div>
    <div class="caja-input">
      <textarea id="entrada" rows="1" placeholder="Escribe aquí…"></textarea>
      <button id="b-demo" title="Pídele al tutor una demo interactiva">✨</button>
      <button class="primario" id="b-enviar">Enviar</button>
    </div>
  </div></div>
</main>
<div id="modal"><div class="ventana">
  <div class="barra-m"><b>📄 Plan del curso</b>
    <div style="display:flex;gap:8px">
      <button id="m-descargar">Descargar .md</button>
      <button id="m-cerrar">Cerrar ✕</button>
    </div></div>
  <div class="cuerpo-m prosa" id="m-cuerpo"></div>
</div></div>
<div id="toast" role="status"></div>
<div id="error" role="alert"></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
let vista = "menu";              // menu | creacion | clase
let modo = "estudio";            // estudio | quiz | conversatorio  (dentro de clase)
let claseActual = null;
let estadoCurso = null;
let lenguajeCurso = "";
let quizActual = null;
let planMd = "";

/* ===== utilidades ===== */
function mostrarError(t){ const c = $("#error"); c.textContent = t; c.style.display = "block";
  setTimeout(() => c.style.display = "none", 7000); }
function toast(t){ const c = $("#toast"); c.textContent = t; c.style.display = "block";
  setTimeout(() => c.style.display = "none", 3200); }

async function api(ruta, cuerpo, metodo){
  const usarPost = metodo === "POST" || cuerpo !== undefined;
  const op = usarPost ? {method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify(cuerpo ?? {})} : {};
  const r = await fetch(ruta, op);
  if(!r.ok){ const d = await r.json().catch(() => ({})); throw new Error(d.detail || `Error ${r.status}`); }
  return r.json();
}

function md(texto){
  const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inl = (s) => esc(s).replace(/`([^`\n]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/\*([^*\n]+)\*/g,"<i>$1</i>");
  const partes = String(texto).split(/```(?:\w*)\n?/);
  let html = "";
  partes.forEach((p, i) => {
    if(i % 2 === 1){ html += `<pre><code>${esc(p.replace(/\n$/,""))}</code></pre>`; return; }
    p.split(/\n{2,}/).forEach(b => {
      const ls = b.split("\n").filter(l => l.trim() !== "");
      if(!ls.length) return;
      if(ls.every(l => /^\s*[-*•] /.test(l)))
        html += "<ul>" + ls.map(l => `<li>${inl(l.replace(/^\s*[-*•] /,""))}</li>`).join("") + "</ul>";
      else if(ls.every(l => /^\s*\d+[.)] /.test(l)))
        html += "<ol>" + ls.map(l => `<li>${inl(l.replace(/^\s*\d+[.)] /,""))}</li>`).join("") + "</ol>";
      else if(/^#{1,4} /.test(ls[0]) && ls.length === 1)
        html += `<h3>${inl(ls[0].replace(/^#{1,4} /,""))}</h3>`;
      else html += "<p>" + ls.map(l => /^#{1,4} /.test(l)
        ? `</p><h3>${inl(l.replace(/^#{1,4} /,""))}</h3><p>` : inl(l)).join("<br>") + "</p>";
    });
  });
  return html;
}

function burbuja(clase, html, quien){
  const d = document.createElement("div");
  d.className = "msg " + clase;
  d.innerHTML = (quien ? `<div class="quien">${quien}</div>` : "") + html;
  $("#mensajes").appendChild(d);
  $("#chat").scrollTop = $("#chat").scrollHeight;
  return d;
}
function burbujaTutor(texto){
  const d = burbuja("tutor", `<div class="prosa">${md(texto)}</div>`, "Profe Bit");
  activarBloquesDeCodigo(d);
  return d;
}
function burbujaEspera(){ return burbuja("tutor dim escribiendo", "El tutor escribe"); }
function reemplazarEspera(espera, texto){
  espera.classList.remove("dim","escribiendo");
  espera.innerHTML = `<div class="quien">Profe Bit</div><div class="prosa">${md(texto)}</div>`;
  activarBloquesDeCodigo(espera);
  $("#chat").scrollTop = $("#chat").scrollHeight;
}
function ponerContexto(texto, chips){
  $("#contexto").innerHTML = texto || "";
  const enlace = $("#ctx-menu");
  if(enlace) enlace.onclick = (e) => { e.preventDefault(); verMenu(); };
  const zona = $("#sugerencias");
  zona.innerHTML = "";
  (chips || []).forEach(([etiqueta, accion]) => {
    const b = document.createElement("button");
    b.textContent = etiqueta;
    b.onclick = accion;
    zona.appendChild(b);
  });
}

/* ===== estado ===== */
async function cargarEstado(){
  let e;
  try{ e = await api("/api/estado"); }
  catch(err){ mostrarError(err.message); return null; }
  estadoCurso = e;
  if(!e.perfil) return e;
  lenguajeCurso = e.lenguaje;
  $("#puntos").style.display = "inline-block"; $("#puntos").textContent = `⭐ ${e.puntos}`;
  $("#racha").style.display = "inline-block"; $("#racha").textContent = `🔥 ${e.racha}`;
  const aprob = e.unidades.filter(u => u.estado === "aprobada").length;
  $("#progreso-curso").style.display = "block";
  $("#progreso-texto").textContent = `${aprob} de ${e.unidades.length} clases aprobadas · ${e.lenguaje}`;
  $("#progreso-barra").style.width = `${Math.round(100 * aprob / e.unidades.length)}%`;
  return e;
}

/* ===== vista: menú de clases ===== */
async function verMenu(){
  vista = "menu";
  claseActual = null;
  $("#composer").style.display = "none";
  const e = estadoCurso && estadoCurso.perfil ? estadoCurso : await cargarEstado();
  if(!e || !e.perfil){ verCreacion(); return; }
  const cont = $("#mensajes");
  cont.innerHTML = `<div class="menu-cabecera">
    <h2>Tus clases</h2>
    <p class="dim" style="font-size:13px">Cada clase es una conversación con tu tutor.
    Aprueba la evaluación (70+) para desbloquear la siguiente.
    <a href="#" id="ver-plan" style="color:var(--acc)">📄 Ver el plan del curso (.md)</a></p></div>`;
  $("#ver-plan").onclick = (ev) => { ev.preventDefault(); abrirPlan(); };
  const siguiente = e.unidades.find(u => u.estado !== "aprobada" && u.estado !== "bloqueada");
  e.unidades.forEach(u => {
    const coronada = u.completada || u.estado === "aprobada";
    const bloqueada = u.estado === "bloqueada";
    const esSiguiente = siguiente && u.indice === siguiente.indice;
    const div = document.createElement("div");
    div.className = "clase" + (coronada ? " coronada" : "") + (bloqueada ? " bloq" : "")
      + (esSiguiente ? " siguiente" : "");
    const numCl = coronada ? "hecha" : (esSiguiente ? "actual" : "");
    const meta = u.estado === "aprobada" ? `✓ Aprobada con ${u.mejor_nota}/100`
      : bloqueada ? "🔒 Se desbloquea aprobando la clase anterior"
      : u.completada ? "Clase completada — te falta la evaluación"
      : u.estado === "evaluada" ? `Último intento: ${u.mejor_nota}/100 — reintenta cuando quieras`
      : u.estado === "vista" ? "Conversación en curso" : "";
    div.innerHTML = `<span class="num ${numCl}">${coronada ? "✓" : u.indice + 1}</span>
      <div class="cuerpo"><b>${u.titulo}</b>
        <ul>${(u.conceptos || []).map(c => `<li>${c}</li>`).join("")}</ul>
        ${meta ? `<div class="meta">${meta}</div>` : ""}</div>
      <div class="cta"></div>`;
    const cta = div.querySelector(".cta");
    if(!bloqueada){
      const b = document.createElement("button");
      b.textContent = u.estado === "aprobada" ? "↩ Repasar"
        : (u.estado === "vista" || u.completada) ? "Continuar →" : "Entrar a la clase →";
      if(esSiguiente) b.className = "primario";
      b.onclick = () => entrarClase(u.indice);
      cta.appendChild(b);
      if(u.completada && u.estado !== "aprobada"){
        const be = document.createElement("button");
        be.textContent = "🎯 Evaluarme";
        be.onclick = () => { entrarClase(u.indice, true); };
        cta.appendChild(be);
      }
    }
    cont.appendChild(div);
  });
  $("#chat").scrollTop = 0;
}
$("#ir-menu").onclick = () => { if(vista !== "creacion") verMenu(); };

async function abrirPlan(){
  if(!planMd){
    try{ planMd = (await api("/api/plan")).md; }
    catch(e){ mostrarError(e.message); return; }
  }
  $("#m-cuerpo").innerHTML = md(planMd);
  $("#modal").style.display = "grid";
  $("#m-descargar").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([planMd], {type:"text/markdown"}));
    a.download = "mi-curso.md"; a.click();
  };
}
$("#m-cerrar").onclick = () => $("#modal").style.display = "none";

/* ===== vista: creación (su propia conversación) ===== */
async function verCreacion(){
  vista = "creacion";
  $("#composer").style.display = "block";
  $("#mensajes").innerHTML = `<div class="hero-chat">
    <div class="logo-xl">Pb</div>
    <h2>¿Qué quieres aprender?</h2>
    <p class="sub">Cuéntamelo con tus palabras. Te haré un par de preguntas, te propondré
    un plan y cuando digas “ya, dale” creo tu curso.</p></div>`;
  await pintarHistorial("creacion");
  ponerContexto("Diseñando tu curso", [
    ["Quiero analizar datos con Python; sé Excel", () => enviar("Hazme un curso de Python para análisis de datos; manejo bien Excel")],
    ["Nunca he programado, quiero hacer webs", () => enviar("Quiero aprender a hacer páginas web desde cero, nunca he programado")],
  ]);
  $("#entrada").focus();
}

async function turnoCreacion(mensaje){
  const espera = burbujaEspera();
  try{
    const r = await api("/api/creacion", {mensaje});
    reemplazarEspera(espera, r.mensaje);
    if(!r.listo) return;
    const gen = burbuja("tutor dim", '<span class="spin"></span> Diseñando tu curso y guardando el plan (~1 min)…');
    await cargarEstado();
    gen.remove();
    toast("Curso creado · plan en curso.md 📄");
    verMenu();
  }catch(err){ espera.remove(); mostrarError(err.message); }
}

/* ===== vista: clase (una conversación por clase) ===== */
async function pintarHistorial(canal){
  try{
    const h = await api(`/api/historial/${canal}`);
    const ultimos = h.mensajes.slice(-80);
    ultimos.forEach(m => {
      if(m.rol === "yo") burbuja("yo", md(m.texto));
      else if(m.rol === "sistema") burbuja("sistema", md(m.texto));
      else burbujaTutor(m.texto);
    });
    return ultimos.length > 0;
  }catch(e){ return false; }
}

async function entrarClase(indice, directoAQuiz){
  vista = "clase";
  modo = "estudio";
  claseActual = indice;
  const u = estadoCurso.unidades[indice];
  $("#composer").style.display = "block";
  $("#mensajes").innerHTML = "";
  burbuja("sistema", `— Clase ${indice + 1}: ${u.titulo} —`);
  const hubo = await pintarHistorial(`u${indice}`);
  ponerContextoClase(u);
  if(directoAQuiz){ iniciarQuiz(indice); return; }
  if(!hubo){
    // Primera vez en esta clase: el tutor abre la conversación
    const espera = burbujaEspera();
    espera.innerHTML = '<span class="spin"></span> Preparando tu clase (primera vez: ~1 min)…';
    try{
      const r = await api("/api/estudio", {unidad: indice});
      reemplazarEspera(espera, r.texto);
      ponerContextoClase(u, r);
    }catch(e){ espera.remove(); mostrarError(e.message); }
  }else{
    burbuja("sistema", "— continúas donde ibas: responde para seguir —");
  }
  $("#entrada").focus();
}

function ponerContextoClase(u, r){
  const avance = r ? ` · paso ${r.paso}/${r.total}` : "";
  const chips = [];
  if(u.completada || u.estado === "aprobada")
    chips.push(["🎯 Presentar la evaluación", () => iniciarQuiz(claseActual)]);
  if(u.completada || u.estado === "aprobada")
    chips.push(["↩ Repasar desde el inicio", () => reiniciarClase()]);
  ponerContexto(
    `<a href="#" id="ctx-menu">← Menú</a>
     <span class="avance">Clase ${claseActual + 1}${avance}</span>
     <span>Responde para avanzar — pregunta lo que quieras</span>`, chips);
}

async function reiniciarClase(){
  burbuja("yo", "Quiero repasar esta clase desde el inicio");
  const espera = burbujaEspera();
  try{
    const r = await api("/api/estudio", {unidad: claseActual});
    reemplazarEspera(espera, r.texto);
  }catch(e){ espera.remove(); mostrarError(e.message); }
}

async function turnoEstudio(mensaje){
  const espera = burbujaEspera();
  try{
    const r = await api("/api/estudio", {mensaje, unidad: claseActual});
    reemplazarEspera(espera, r.texto);
    const u = estadoCurso.unidades[claseActual];
    ponerContextoClase(u, r);
    if(r.terminada){
      await cargarEstado();
      const card = burbuja("tutor ancha celebra",
        `<div class="quien">Profe Bit</div><div class="prosa">
        <p>🎉 <b>¡Clase ${r.unidad + 1} completada!</b> Quedó tachada en tu menú.</p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
          <button class="primario" id="c-evaluar">🎯 Presentar la evaluación</button>
          <button id="c-menu">🏠 Volver al menú</button>
        </div>`);
      card.querySelector("#c-evaluar").onclick = () => iniciarQuiz(r.unidad);
      card.querySelector("#c-menu").onclick = () => verMenu();
    }
  }catch(err){ espera.remove(); mostrarError(err.message); }
}

/* ===== evaluación dentro de la clase ===== */
async function iniciarQuiz(indice){
  modo = "quiz";
  burbuja("yo", "Quiero presentar la evaluación");
  const espera = burbujaEspera();
  espera.innerHTML = '<span class="spin"></span> Escribiendo tus preguntas y verificándolas (~40 s)…';
  let quiz;
  try{ quiz = await api(`/api/quiz/${indice}`, undefined, "POST"); }
  catch(e){ espera.remove(); mostrarError(e.message); modo = "estudio"; return; }
  espera.remove();
  quizActual = {indice, preguntas: quiz.preguntas};
  const card = burbuja("tutor ancha", `<div class="quien">🎯 Evaluación · clase ${indice + 1}</div>
    <p class="dim" style="font-size:12.5px;margin-bottom:10px">Apruebas con 70+. Puedes reintentar con preguntas nuevas.</p>
    <div id="q-zona"></div><div id="q-error"></div>
    <button class="primario" id="q-calificar" style="margin-top:8px">Calificar</button>`);
  quiz.preguntas.forEach((p, i) => {
    const f = document.createElement("fieldset");
    f.style.cssText = "border:1px solid var(--linea);border-radius:10px;padding:12px;margin-bottom:10px";
    f.innerHTML = `<legend style="font-size:11px;color:var(--tx3);padding:0 6px">PREGUNTA ${i + 1} DE ${quiz.preguntas.length}</legend>
      <div class="prosa">${md(p.enunciado)}</div>` +
      p.opciones.map((op, j) =>
        `<label class="opcion"><input type="radio" name="p${i}" value="${j}" style="margin-top:3px">
         <span class="prosa">${md(op)}</span></label>`).join("");
    card.querySelector("#q-zona").appendChild(f);
  });
  card.querySelector("#q-calificar").onclick = () => calificarQuiz(card);
  ponerContexto(`<a href="#" id="ctx-menu">← Menú</a>
    <span class="avance">Evaluación en curso</span><span>Responde y pulsa Calificar</span>`);
  $("#chat").scrollTop = $("#chat").scrollHeight;
}

async function calificarQuiz(card){
  const q = quizActual;
  const respuestas = q.preguntas.map((_, i) => {
    const m = card.querySelector(`input[name="p${i}"]:checked`);
    return m ? Number(m.value) : -1;
  });
  const faltan = respuestas.map((r, i) => r === -1 ? i + 1 : null).filter(Boolean);
  if(faltan.length){
    card.querySelector("#q-error").innerHTML =
      `<p class="mal" style="font-size:13px">Te falta responder: ${faltan.join(", ")}.</p>`;
    return;
  }
  let r;
  try{ r = await api(`/api/quiz/${q.indice}/calificar`, {respuestas}); }
  catch(e){ mostrarError(e.message); return; }
  card.querySelector("#q-calificar").remove();
  $("#puntos").textContent = `⭐ ${r.puntos_totales}`;
  let html = r.aprobado
    ? `<div class="quien">Resultado</div><h3 class="ok">🎉 Aprobada · ${r.nota}/100</h3>
       <p class="dim">Desbloqueaste la siguiente clase (+30 ⭐).</p>`
    : `<div class="quien">Resultado</div><h3>${r.detalle.filter(d=>d.acierto).length} de ${r.detalle.length} — cerremos esas brechas</h3>
       <p class="dim">Conversemos tus dudas aquí mismo y reintentas con preguntas nuevas.</p>`;
  r.detalle.forEach((d, i) => {
    html += `<div style="border:1px solid var(--linea);border-radius:10px;padding:10px;margin:8px 0">
      ${d.acierto ? "✅" : "❌"} <b>P${i + 1}</b> — elegiste: <span class="prosa">${md(d.elegida)}</span>
      ${d.acierto ? "" : `<div>Correcta: <span class="ok prosa">${md(d.correcta)}</span></div>`}
      <div class="dim prosa" style="font-size:12.5px;margin-top:4px">${md(d.explicacion)}</div></div>`;
  });
  const res = burbuja("tutor ancha" + (r.aprobado ? " celebra" : ""), html);
  await cargarEstado();
  if(r.aprobado){
    toast(`+30 ⭐ · Clase ${q.indice + 1} aprobada`);
    const sig = q.indice + 1;
    const hay = estadoCurso && sig < estadoCurso.unidades.length;
    const botones = document.createElement("div");
    botones.style.cssText = "display:flex;gap:8px;margin-top:8px";
    botones.innerHTML = (hay ? `<button class="primario" id="r-seguir">Ir a la clase ${sig + 1} →</button>` :
      `<p class="ok"><b>🏆 ¡Terminaste el curso completo!</b></p>`) +
      `<button id="r-menu">🏠 Menú</button>`;
    res.appendChild(botones);
    if(hay) botones.querySelector("#r-seguir").onclick = () => entrarClase(sig);
    botones.querySelector("#r-menu").onclick = () => verMenu();
    modo = "estudio";
  }else{
    modo = "conversatorio";
    const falladas = r.detalle.map((d, i) => !d.acierto ? i + 1 : null).filter(Boolean);
    ponerContexto(
      `<a href="#" id="ctx-menu">← Menú</a>
       <span class="avance">Conversatorio de dudas</span><span>Cuando estés al día, reintenta</span>`,
      [...falladas.slice(0, 2).map(n => [`Explícame la pregunta ${n}`,
          () => enviar(`Explícame en qué me equivoqué en la pregunta ${n}`)]),
       ["Ya estoy listo: reintentar 🎯", () => iniciarQuiz(q.indice)]]
    );
    const espera = burbujaEspera();
    try{
      const c = await api(`/api/conversatorio/${q.indice}`, {mensaje: ""});
      reemplazarEspera(espera, c.texto);
    }catch(err){ espera.remove(); mostrarError(err.message); }
  }
  quizActual = null;
}

async function turnoConversatorio(mensaje){
  const espera = burbujaEspera();
  try{
    const r = await api(`/api/conversatorio/${claseActual}`, {mensaje});
    reemplazarEspera(espera, r.texto);
  }catch(e){ espera.remove(); mostrarError(e.message); }
}

/* ===== Pyodide + Python Tutor ===== */
let pyodideListo = null;
function cargarPyodide(){
  if(!pyodideListo){
    pyodideListo = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";
      s.onload = () => loadPyodide().then(res, rej);
      s.onerror = () => rej(new Error("No se pudo descargar Python (¿sin internet?)."));
      document.head.appendChild(s);
    });
  }
  return pyodideListo;
}
async function ejecutarPython(codigo, salida, boton){
  salida.className = "salida";
  boton.disabled = true; boton.textContent = "Ejecutando…";
  salida.textContent = pyodideListo ? "▶ Ejecutando…" : "⏳ Preparando Python (solo la primera vez, ~10 s)…";
  let py;
  try{ py = await cargarPyodide(); }
  catch(e){ salida.className = "salida err"; salida.textContent = e.message;
    boton.disabled = false; boton.textContent = "▶ Ejecutar"; return; }
  py.runPython("import sys, io\nsys.stdout = sys.stderr = io.StringIO()");
  let error = null;
  try{ py.runPython(codigo); }
  catch(e){ error = String(e.message || e).split("\n").filter(l => !l.includes("pyodide")).slice(-8).join("\n"); }
  const out = py.runPython("sys.stdout.getvalue()");
  if(error){ salida.className = "salida err"; salida.textContent = (out ? out + "\n" : "") + error; }
  else{ salida.textContent = out || "(corrió sin imprimir nada — agrega un print())"; }
  boton.disabled = false; boton.textContent = "▶ Ejecutar";
}
function activarBloquesDeCodigo(raiz){
  if(lenguajeCurso !== "python") return;
  raiz.querySelectorAll("pre").forEach(pre => {
    if(pre.dataset.activado) return;
    pre.dataset.activado = "1";
    const codigo = pre.textContent;
    if(!codigo.trim() || codigo.split("\n").length < 2) return;
    const barra = document.createElement("div");
    barra.className = "code-acciones";
    barra.innerHTML = `<button>▶ Pruébalo</button><button>🔍 Paso a paso</button>`;
    const [bRun, bViz] = barra.querySelectorAll("button");
    bViz.onclick = () => window.open("https://pythontutor.com/render.html#code=" +
      encodeURIComponent(codigo) + "&cumulative=false&py=311&curInstr=0", "_blank");
    bRun.onclick = () => {
      bRun.disabled = true;
      const runner = document.createElement("div");
      runner.className = "runner";
      runner.innerHTML = `<textarea spellcheck="false"></textarea>
        <div><button class="primario">▶ Ejecutar</button></div>
        <div class="salida dim">Corre en TU navegador: edítalo sin miedo.</div>`;
      runner.querySelector("textarea").value = codigo.trimEnd();
      const bE = runner.querySelector("button");
      bE.onclick = () => ejecutarPython(runner.querySelector("textarea").value,
        runner.querySelector(".salida"), bE);
      barra.after(runner);
    };
    pre.after(barra);
  });
}

/* ===== composer ===== */
function enviar(textoDirecto){
  const area = $("#entrada");
  const texto = (textoDirecto ?? area.value).trim();
  if(!texto) return;
  if(!textoDirecto) area.value = "";
  area.style.height = "auto";
  burbuja("yo", md(texto));
  if(vista === "creacion") turnoCreacion(texto);
  else if(modo === "conversatorio") turnoConversatorio(texto);
  else turnoEstudio(texto);
}
$("#b-enviar").onclick = () => enviar();
const area = $("#entrada");
area.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); enviar(); }
});
area.addEventListener("input", () => {
  area.style.height = "auto";
  area.style.height = Math.min(120, area.scrollHeight) + "px";
});

/* ===== arranque ===== */
(async () => {
  const e = await cargarEstado();
  if(!e || !e.perfil){ verCreacion(); return; }
  verMenu();
})();
